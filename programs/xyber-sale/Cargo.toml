[package]
name = "xyber-sale"
version = "0.1.0"
description = "Xyber token sale solana program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "xyber_sale"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
anchor-debug = []
test = []
localnet = []
devnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[lints.rust]
deprecated = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
