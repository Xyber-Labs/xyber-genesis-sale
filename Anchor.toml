[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
xyber_sale = "XYBGKPCgL6Twhdjo6LFt9niCgyxnbxN3tacXypc6SSt"

[programs.localnet]
xyber_sale = "XYBGKPCgL6Twhdjo6LFt9niCgyxnbxN3tacXypc6SSt"


[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test.validator]
url = "https://api.mainnet-beta.solana.com"
startup_wait = 30000
bind_address = "127.0.0.1"

# Pyth Oracle Program (mainnet)
# Docs: https://docs.pyth.network/price-feeds
[[test.validator.clone]]
address = "FsJ3A3u2vn5cTVofAjvy6y5kwABJAqYWpe4975bi2epH"

# SOL/USD Price Feed (mainnet)
# Feed page: https://pyth.network/price-feeds/crypto-sol-usd
# Price Feed ID: 0xef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d
[[test.validator.clone]]
address = "H6ARHf6YXhGYeQfUzQNGk6rDNnLBQKrenN712K4AQJEG"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.test.ts'"
initialize = "yarn run ts-node scripts/initialize.ts"
set-quote-mint = "yarn run ts-node scripts/set-quote-mint.ts"
setup-round = "yarn run ts-node scripts/setup-round.ts"
setup-bucket = "yarn run ts-node scripts/setup-bucket.ts"
setup-vesting-plan = "yarn run ts-node scripts/setup-vesting-plan.ts"
setup-24m-vesting-plan = "yarn run ts-node scripts/setup-24m-vesting-plan.ts"
setup-deterministic-vesting = "yarn run ts-node scripts/setup-deterministic-vesting.ts"
mint-to-bucket = "yarn run ts-node scripts/mint-to-bucket.ts"
deposit-sol = "yarn run ts-node scripts/deposit-sol.ts"
deposit-asset = "yarn run ts-node scripts/deposit-asset.ts"
claim = "yarn run ts-node scripts/claim.ts"
withdraw-sol = "yarn run ts-node scripts/withdraw-sol.ts"
withdraw-asset = "yarn run ts-node scripts/withdraw-asset.ts"
withdraw-unsold-tokens = "yarn run ts-node scripts/withdraw-unsold-tokens.ts"

