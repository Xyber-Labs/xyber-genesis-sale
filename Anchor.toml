[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
xyber_sale = "XYBGKPCgL6Twhdjo6LFt9niCgyxnbxN3tacXypc6SSt"

[programs.localnet]
xyber_sale = "XYBGKPCgL6Twhdjo6LFt9niCgyxnbxN3tacXypc6SSt"


[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.test.ts'"
initialize = "yarn run ts-node scripts/initialize.ts"
setup-round = "yarn run ts-node scripts/setup-round.ts"
setup-bucket = "yarn run ts-node scripts/setup-bucket.ts"
setup-vesting-plan = "yarn run ts-node scripts/setup-vesting-plan.ts"
mint-to-bucket = "yarn run ts-node scripts/mint-to-bucket.ts"
deposit-sol = "yarn run ts-node scripts/deposit-sol.ts"
deposit-asset = "yarn run ts-node scripts/deposit-asset.ts"
claim = "yarn run ts-node scripts/claim.ts"

